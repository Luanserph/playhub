name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust stable (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Configure Android SDK and NDK environment
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR=$(ls -d "$ANDROID_SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Android NDK não encontrado em $ANDROID_SDK/ndk/*" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK"
          echo "NDK_HOME=$NDK_DIR"

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Configurar usesCleartextTraffic com segurança
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (/android:usesCleartextTraffic\s*=\s*"[^"]*"/.test(xml)) {
              xml = xml.replace(/android:usesCleartextTraffic\s*=\s*"[^"]*"/g, "android:usesCleartextTraffic=\"true\"");
            } else {
              xml = xml.replace(/<application\b/, "<application\n        android:usesCleartextTraffic=\"true\"");
            }
            fs.writeFileSync(p, xml, "utf8");
            console.log("=== AndroidManifest.xml final ===");
            console.log(xml);
          '

      - name: Build Android APK (aarch64 debug)
        run: npx tauri android build --apk --target aarch64 --debug

      # Após validar o primeiro APK debug e configurar o keystore nos secrets do repositório,
      # substitua o passo acima pelo build de release assinado:
      # - name: Build Android APK (aarch64 signed release)
      #   run: npx tauri android build --apk --target aarch64

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playhub-android-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
