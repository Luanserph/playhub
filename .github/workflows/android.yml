name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust stable (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Configure Android SDK and NDK environment
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR=$(ls -d "$ANDROID_SDK"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Android NDK não encontrado em $ANDROID_SDK/ndk/*" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK"
          echo "NDK_HOME=$NDK_DIR"

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Configurar usesCleartextTraffic com segurança
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            if (/android:usesCleartextTraffic\s*=\s*"[^"]*"/.test(xml)) {
              xml = xml.replace(/android:usesCleartextTraffic\s*=\s*"[^"]*"/g, "android:usesCleartextTraffic=\"true\"");
            } else {
              xml = xml.replace(/<application\b/, "<application\n        android:usesCleartextTraffic=\"true\"");
            }
            fs.writeFileSync(p, xml, "utf8");
            console.log("=== AndroidManifest.xml final ===");
            console.log(xml);
          '

      - name: Build Android APK (aarch64 release)
        run: npx tauri android build --apk --target aarch64 --verbose

      - name: Align and sign Android Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "ANDROID_KEYSTORE_BASE64: $([ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && echo OK || echo VAZIO)"
          echo "ANDROID_KEY_ALIAS: $([ -n "${ANDROID_KEY_ALIAS:-}" ] && echo OK || echo VAZIO)"
          echo "ANDROID_KEYSTORE_PASSWORD: $([ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && echo OK || echo VAZIO)"

          MISSING=0
          [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] && MISSING=1
          [ -z "${ANDROID_KEY_ALIAS:-}" ] && MISSING=1
          [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] && MISSING=1
          if [ "$MISSING" -ne 0 ]; then
            echo "Um ou mais secrets Android obrigatórios estão vazios." >&2
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/playhub-release.keystore
          trap 'rm -f /tmp/playhub-release.keystore PlayHub-android-arm64-aligned.apk' EXIT

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then
            echo "Android build-tools não encontrado em $ANDROID_HOME/build-tools/*" >&2
            exit 1
          fi
          echo "Using build-tools: $BUILD_TOOLS"

          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk/arm64/release -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "APK release não encontrado em src-tauri/gen/android/app/build/outputs/apk/arm64/release/" >&2
            exit 1
          fi
          echo "Found raw APK: $RAW_APK"

          "$BUILD_TOOLS/zipalign" -p -f -v 4 "$RAW_APK" PlayHub-android-arm64-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/playhub-release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --out PlayHub-android-arm64.apk \
            PlayHub-android-arm64-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose PlayHub-android-arm64.apk

      - name: Upload signed Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: playhub-android-arm64-apk
          path: PlayHub-android-arm64.apk
          if-no-files-found: error

      - name: Attach signed APK to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PlayHub-android-arm64.apk
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
