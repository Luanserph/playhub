name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install root and server dependencies
        run: |
          npm install
          npm --prefix server install

      - name: Download FFmpeg and FFprobe sidecars
        run: |
          $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zipPath = "$env:RUNNER_TEMP\ffmpeg.zip"
          $extractDir = "$env:RUNNER_TEMP\ffmpeg-extract"

          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1

          if (-not $ffmpegExe -or -not $ffprobeExe) {
            throw "ffmpeg.exe ou ffprobe.exe não encontrado no arquivo baixado."
          }

          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          Move-Item -Path $ffmpegExe.FullName -Destination "src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe" -Force
          Move-Item -Path $ffprobeExe.FullName -Destination "src-tauri\binaries\ffprobe-x86_64-pc-windows-msvc.exe" -Force

      - name: Build PlayHub backend sidecar
        run: npm --prefix server run build:sidecar

      - name: Smoke test PlayHub backend sidecar
        run: |
          $sidecarPath = Resolve-Path "src-tauri\binaries\playhub-server-x86_64-pc-windows-msvc.exe"
          $logOut = "$env:RUNNER_TEMP\sidecar-stdout.log"
          $logErr = "$env:RUNNER_TEMP\sidecar-stderr.log"
          $proc = Start-Process -FilePath $sidecarPath -PassThru -NoNewWindow -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          try {
            Start-Sleep -Seconds 3
            if ($proc.HasExited) {
              Write-Host "=== STDERR ==="
              if (Test-Path $logErr) { Get-Content $logErr }
              Write-Host "=== STDOUT ==="
              if (Test-Path $logOut) { Get-Content $logOut }
              throw "playhub-server encerrou prematuramente com código $($proc.ExitCode)."
            }
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:3001/api/health" -TimeoutSec 5
            if (-not $health.ok) {
              throw "Resposta inesperada de /api/health: $($health | ConvertTo-Json -Compress)"
            }
            Write-Host "Sidecar /api/health OK: $($health | ConvertTo-Json -Compress)"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Build & Publish Draft Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PlayHub v__VERSION__'
          releaseBody: |
            ### Primeira versão instalável para Windows (Tudo-em-Um)

            Instalação em dois cliques, sem precisar configurar Node.js, FFmpeg ou rodar comandos no terminal.

            **O que vem na v__VERSION__:**
            - **Instalador Windows autossuficiente (NSIS):** embute o servidor local (`playhub-server`), `ffmpeg` e `ffprobe`, iniciando e encerrando tudo automaticamente com a janela do app.
            - **Catálogo TMDB completo + Proxy local:** busca rápida, tela de detalhes Full-View com slideshow, elenco, barra de temporadas temática e efeito Ambilight nos cards.
            - **Player Híbrido e Nativo:** reprodução via `imdb.su` ou torrents (`torrent-stream` + FFmpeg/NVENC), controle de proporção de tela (`16:9`, `4:3`, `21:9`, Preencher e Esticar) e envio para VLC/MPV (`.m3u`).
            - **Legendas PT-BR inteligentes:** separação entre `PT-BR` e `PT-PT`, extração de legendas embutidas em MKV, busca multi-fonte, tradução automática e upload de `.srt`/`.ass`.
            - **Downloads e Modo Offline:** baixe filmes e episódios com legenda `PT-BR` salva automaticamente na pasta `Downloads\PlayHub` para assistir sem internet.
            - **Catálogo de Add-ons integrado:** instalação com 1 clique para Torrentio, Comet, MediaFusion, Brazuca Torrents, Peerflix e OpenSubtitles v3.

            **Como instalar:**
            1. Baixe o arquivo `PlayHub___VERSION___x64-setup.exe` em **Assets** abaixo.
            2. Execute o instalador (não exige permissão de administrador).
            3. Na primeira abertura, informe sua chave gratuita da API do TMDB no assistente inicial.
          releaseDraft: true
          prerelease: false

      - name: Build Windows NSIS installer (manual workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri build

      - name: Upload NSIS installer artifact (manual workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: playhub-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
